<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 뷰어 (GitHub 기본 + 로컬 선택)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg">
        <i class="fa-solid fa-file-pdf text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white">GitHub PDF Viewer</h1>
        <p class="text-xs text-slate-400">기본 ABC.pdf 로드 및 로컬 PDF 파일 지원</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-3">
      <!-- Local File Input -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium px-4 py-2.5 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-indigo-400"></i>
        <span>다른 PDF 열기 (로컬)</span>
        <input type="file" id="localFileInput" accept="application/pdf" class="hidden">
      </label>

      <!-- Page Navigation -->
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-xs">
        <button id="prevPage" class="p-1 hover:text-indigo-400 transition"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="font-mono"><span id="pageNum">1</span> / <span id="pageCount">-</span></span>
        <button id="nextPage" class="p-1 hover:text-indigo-400 transition"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </header>

  <!-- Main Viewer Area -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-6 flex flex-col items-center justify-center">
    <div id="pdfContainer" class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-4 overflow-auto max-h-[80vh] flex items-center justify-center relative w-full min-h-[600px]">
      <canvas id="pdfCanvas" class="shadow-lg max-w-full h-auto"></canvas>
      
      <!-- Loading Indicator -->
      <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3">
        <i class="fa-solid fa-spinner fa-spin text-indigo-500 text-3xl"></i>
        <p class="text-xs text-slate-300 font-medium" id="loadingText">GitHub에서 기본 PDF(ABC.pdf)를 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <script>
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.3;
    
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // 1. 페이지 접속 시 GitHub에 있는 ABC.pdf를 기본으로 로드
    const defaultPdfUrl = './ABC.pdf'; 
    loadPdf(defaultPdfUrl, "GitHub 기본 ABC.pdf 로딩 완료");

    // 2. 로컬 파일 선택 시 처리
    document.getElementById('localFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileReader = new FileReader();
        loadingOverlay.classList.remove('hidden');
        loadingText.textContent = `로컬 파일(${file.name})을 불러오는 중입니다...`;

        fileReader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          loadPdfData(typedarray);
        };
        fileReader.readAsArrayBuffer(file);
      }
    });

    // PDF 로드 함수 (URL 방식 - GitHub용)
    function loadPdf(url, successMessage) {
      loadingOverlay.classList.remove('hidden');
      pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('pageCount').textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
        loadingOverlay.classList.add('hidden');
      }).catch(function(error) {
        console.error('PDF Load Error:', error);
        loadingText.innerHTML = `<span class="text-red-400">PDF 파일을 불러오지 못했습니다.<br>ABC.pdf 파일이 GitHub 저장소 루트에 있는지 확인해주세요.</span>`;
      });
    }

    // PDF 로드 함수 (바이너리 데이터 방식 - 로컬 파일용)
    function loadPdfData(data) {
      pdfjsLib.getDocument({ data: data }).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('pageCount').textContent = pdfDoc.numPages;
        pageNum = 1;
        renderPage(pageNum);
        loadingOverlay.classList.add('hidden');
      }).catch(function(error) {
        console.error('PDF Data Load Error:', error);
        loadingText.innerHTML = `<span class="text-red-400">로컬 PDF 파일을 읽어오는 중 오류가 발생했습니다.</span>`;
      });
    }

    // 페이지 렌더링
    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('pageNum').textContent = num;
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });
  </script>
</body>
</html>
