
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 페이지 뷰어</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 메뉴: 한 줄 유지, 가운데 정렬, 가로 스크롤 */
    #toolbarOuter {
      flex: 0 0 auto;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: #fff;
      border-bottom: 1px solid #d1d5db;
      scrollbar-width: thin;
    }

    #toolbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: max-content;
      min-width: 100%;
      padding: 10px 16px;
      white-space: nowrap;
    }

    #toolbar button,
    #toolbar input {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #fff;
    }

    #toolbar button {
      cursor: pointer;
    }

    #toolbar button:hover:not(:disabled) {
      background: #e8eef7;
    }

    #toolbar button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #toolbar input[type="number"] {
      width: 64px;
      text-align: center;
    }

    #toolbar input[type="file"] {
      width: 220px;
      padding: 4px;
    }

    #appTitle {
      flex: 0 0 auto;
      margin-right: 6px;
      font-size: 16px;
      font-weight: bold;
    }

    #pageInfo, #zoomInfo {
      flex: 0 0 auto;
      font-size: 14px;
    }

    .menuDivider {
      flex: 0 0 auto;
      height: 24px;
      border-left: 1px solid #d1d5db;
      margin: 0 3px;
    }

    /* PDF 표시 영역: 필요 시 가로·세로 스크롤 */
    #pageWrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      overflow: auto;
      padding: 0;
      background: #e5e7eb;
    }

    /* 화면 맞춤 시 캔버스를 가로 중앙에 배치 */
    #pageCenter {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 100%;
      min-height: 100%;
      width: 100%;
      padding: 12px;
    }

    #pdfCanvas {
      display: block;
      flex: 0 0 auto;
      max-width: none;
      height: auto;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    #helpText {
      flex: 0 0 auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 12px;
      text-align: center;
      color: #666;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    #status {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="toolbarOuter">
    <div id="toolbar">
      <span id="appTitle">PDF 뷰어</span>

      <button id="prevBtn" disabled>◀ 이전</button>
      <button id="nextBtn" disabled>다음 ▶</button>

      <span>페이지</span>
      <input id="pageInput" type="number" min="1" value="1" disabled>
      <span id="pageInfo">/ 0</span>

      <span class="menuDivider"></span>

      <button id="zoomOutBtn" disabled>−</button>
      <span id="zoomInfo">100%</span>
      <button id="zoomInBtn" disabled>+</button>
      <button id="fitBtn" disabled>100%로 보기</button>

      <span class="menuDivider"></span>

      <label for="pdfFile">PDF 열기</label>
      <input id="pdfFile" type="file" accept="application/pdf">
    </div>
  </div>

  <main id="pageWrap">
    <div id="pageCenter">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <p id="helpText">
    기본 파일은 같은 폴더의 book.pdf입니다.
    마지막 페이지와 확대 설정은 브라우저에 저장됩니다.
  </p>

  <div id="status"></div>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInput = document.getElementById("pageInput");
    const pageInfo = document.getElementById("pageInfo");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomInfo = document.getElementById("zoomInfo");
    const fitBtn = document.getElementById("fitBtn");
    const pdfFile = document.getElementById("pdfFile");
    const pageWrap = document.getElementById("pageWrap");
    const pageCenter = document.getElementById("pageCenter");

    const STORAGE_KEY = "youtubebook_pdf_viewer_state_v3";

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.0;

    // true: 가로 폭 맞춤, false: 사용자 지정 배율
    let fitMode = true;

    let renderTask = null;
    let renderSequence = 0;
    let resizeTimer = null;

    let savedState = {};

    try {
      savedState = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "{}"
      );
    } catch {
      savedState = {};
    }

    currentPage = Math.max(1, Number(savedState.page) || 1);
    scale = Number(savedState.scale) || 1;
    fitMode = savedState.fitMode !== false;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          page: currentPage,
          scale,
          fitMode
        }));
      } catch (error) {
        console.log("상태 저장 실패:", error);
      }
    }

    function updateControls() {
      if (!pdfDoc) return;

      pageInput.value = currentPage;
      pageInput.max = pdfDoc.numPages;
      pageInfo.textContent = `/ ${pdfDoc.numPages}`;

      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
      pageInput.disabled = false;
      zoomOutBtn.disabled = false;
      zoomInBtn.disabled = false;
      fitBtn.disabled = false;

      zoomInfo.textContent = `${Math.round(scale * 100)}%`;

      // 버튼은 클릭하면 전환될 모드를 표시
      fitBtn.textContent = fitMode ? "100%로 보기" : "화면 맞춤";
    }

    function calculateWidthFitScale(baseViewport) {
      const style = getComputedStyle(pageCenter);
      const padding =
        parseFloat(style.paddingLeft) +
        parseFloat(style.paddingRight);

      // 표시 영역 가로 폭에 페이지를 최대한 맞춤
      const availableWidth = Math.max(
        50,
        pageWrap.clientWidth - padding
      );

      return availableWidth / baseViewport.width;
    }

    async function renderPage() {
      if (!pdfDoc) return;

      const sequence = ++renderSequence;

      if (renderTask) {
        try {
          renderTask.cancel();
        } catch {}
        renderTask = null;
      }

      try {
        const page = await pdfDoc.getPage(currentPage);
        if (sequence !== renderSequence) return;

        const baseViewport = page.getViewport({ scale: 1 });

        if (fitMode) {
          // 화면 맞춤은 세로 높이가 아니라 가로 폭에 맞춘다.
          // 따라서 페이지가 세로로 길어지면 세로 스크롤이 생긴다.
          scale = calculateWidthFitScale(baseViewport);
        }

        // 100% 모드에서는 scale=1.0을 그대로 유지한다.
        scale = Math.max(0.1, Math.min(scale, 5));

        const viewport = page.getViewport({ scale });
        const pixelRatio = window.devicePixelRatio || 1;

        canvas.width = Math.round(viewport.width * pixelRatio);
        canvas.height = Math.round(viewport.height * pixelRatio);

        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        renderTask = page.render({
          canvasContext: ctx,
          viewport
        });

        await renderTask.promise;

        if (sequence !== renderSequence) return;

        renderTask = null;

        // 확대된 페이지도 축소하지 않고 실제 크기로 표시
        pageCenter.style.width = "100%";
        pageCenter.style.minWidth = `${viewport.width + 24}px`;
        pageCenter.style.minHeight = `${viewport.height + 24}px`;

        updateControls();
        saveState();
      } catch (error) {
        if (error?.name !== "RenderingCancelledException") {
          console.log("PDF 페이지 표시 오류:", error);
        }
      }
    }

    async function loadPdf(source) {
      try {
        const loadingTask = pdfjsLib.getDocument(source);
        const loadedDoc = await loadingTask.promise;

        pdfDoc = loadedDoc;
        currentPage = Math.max(
          1,
          Math.min(currentPage, pdfDoc.numPages)
        );

        updateControls();
        await renderPage();
      } catch (error) {
        console.log("PDF를 열 수 없습니다:", error);
      }
    }

    prevBtn.addEventListener("click", () => {
      if (!pdfDoc || currentPage <= 1) return;
      currentPage--;
      renderPage();
    });

    nextBtn.addEventListener("click", () => {
      if (!pdfDoc || currentPage >= pdfDoc.numPages) return;
      currentPage++;
      renderPage();
    });

    pageInput.addEventListener("change", () => {
      if (!pdfDoc) return;

      const value = Number.parseInt(pageInput.value, 10);

      if (!Number.isFinite(value)) {
        pageInput.value = currentPage;
        return;
      }

      currentPage = Math.max(1, Math.min(value, pdfDoc.numPages));
      renderPage();
    });

    // 수동 축소
    zoomOutBtn.addEventListener("click", () => {
      if (!pdfDoc) return;

      if (fitMode) {
        // 현재 화면 맞춤 배율에서 10% 낮춘 배율로 전환
        scale = calculateWidthFitScale(
          { width: pdfDoc.numPages ? canvas.width / (window.devicePixelRatio || 1) / scale : 1 }
        );
      }

      fitMode = false;
      scale = Math.max(0.1, scale - 0.1);
      renderPage();
    });

    // 수동 확대
    zoomInBtn.addEventListener("click", () => {
      if (!pdfDoc) return;

      if (fitMode) {
        fitMode = false;
        scale = Math.min(5, scale + 0.1);
      } else {
        scale = Math.min(5, scale + 0.1);
      }

      fitMode = false;
      renderPage();
    });

    // 토글: 화면 가로 폭 맞춤 ↔ 정확한 100%
    fitBtn.addEventListener("click", () => {
      if (!pdfDoc) return;

      if (fitMode) {
        // 현재 가로 맞춤에서 정확히 100%로 전환
        fitMode = false;
        scale = 1.0;
      } else {
        // 100%에서 화면 가로 맞춤으로 전환
        fitMode = true;
      }

      renderPage();
    });

    pdfFile.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      currentPage = 1;
      fitMode = true;

      await loadPdf({
        data: await file.arrayBuffer()
      });
    });

    document.addEventListener("keydown", (event) => {
      const tag = event.target?.tagName;

      if (
        tag === "INPUT" ||
        tag === "TEXTAREA" ||
        event.ctrlKey ||
        event.altKey ||
        event.metaKey
      ) {
        return;
      }

      if (event.key === "ArrowLeft") {
        if (pdfDoc && currentPage > 1) {
          currentPage--;
          renderPage();
        }
      } else if (event.key === "ArrowRight") {
        if (pdfDoc && currentPage < pdfDoc.numPages) {
          currentPage++;
          renderPage();
        }
      } else if (event.key === "+" || event.key === "=") {
        if (!pdfDoc) return;
        fitMode = false;
        scale = Math.min(5, scale + 0.1);
        renderPage();
      } else if (event.key === "-") {
        if (!pdfDoc) return;
        fitMode = false;
        scale = Math.max(0.1, scale - 0.1);
        renderPage();
      }
    });

    window.addEventListener("resize", () => {
      if (!pdfDoc || !fitMode) return;

      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderPage(), 150);
    });

    loadPdf("./book.pdf");
  </script>
</body>
</html>
